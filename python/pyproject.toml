[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexml-companion"
version = "0.1.0"
description = "Companion library for the FlexML iOS app: receive vision, pose and 3D map streams, control the phone, bridge to ROS 2."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["websockets>=12"]

[project.optional-dependencies]
discovery = ["zeroconf>=0.130"]
qr = ["qrcode>=7.4"]
map = ["numpy>=1.21"]
check = ["coremltools>=8", "pillow>=9"]
all = ["zeroconf>=0.130", "qrcode>=7.4", "numpy>=1.21"]

[project.scripts]
flexml = "flexml_companion.cli:main"

[tool.setuptools]
packages = ["flexml_companion"]

[project.urls]
Homepage = "https://github.com/Arjun-2005aa/FlexML_SDK"
Documentation = "https://github.com/Arjun-2005aa/FlexML_SDK/tree/main/docs"
