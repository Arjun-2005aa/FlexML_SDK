name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "./python[all]"
      - name: Unit tests
        run: cd python && python -m unittest discover -s tests
      - name: Examples compile
        run: python -m py_compile examples/python/*.py examples/ros2/*.py
